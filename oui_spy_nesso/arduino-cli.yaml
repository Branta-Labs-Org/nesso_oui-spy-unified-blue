board_manager:
  additional_urls:
    - https://espressif.github.io/arduino-esp32/package_esp32_index.json

default_fqbn: esp32:esp32:arduino_nesso_n1
default_port: /dev/cu.usbmodem14401

build_flags:
  -DNESSO_N1=1
  -DNESSO_DISPLAY_UI=1
  -DCONFIG_BT_NIMBLE_ENABLED=1
  -Iraw

library_paths:
  - libraries
