# Project-local Arduino CLI config for Nesso builds.
# Uses .arduino-cli-user/ (see scripts/setup-arduino-user.sh) so the patched
# vendored AsyncTCP is linked instead of ~/Documents/Arduino/libraries/AsyncTCP@1.1.4.
#
# Build/upload through scripts/compile-nesso.sh: it injects the build flags via
# --build-property and auto-detects the board's serial port. No board is
# hardwired here so any attached Nesso N1 works.

board_manager:
  additional_urls:
    - https://espressif.github.io/arduino-esp32/package_esp32_index.json

directories:
  user: .arduino-cli-user

default_fqbn: esp32:esp32:arduino_nesso_n1
